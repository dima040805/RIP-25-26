x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:-postgres}
  DB_PASS: ${DB_PASS:-postgres}
  DB_NAME: ${DB_NAME:-exoplanets}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: ${DB_NAME:-exoplanets}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-exoplanets}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_USER:-minioadmin} ${MINIO_PASS:-minioadmin}
      && mc mb --ignore-existing local/test
      && mc anonymous set download local/test"

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      <<: *db-env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      <<: *db-env
      JWT_KEY: ${JWT_KEY:-change-me}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASS: ${MINIO_PASS:-minioadmin}
      ASYNC_SERVICE_URL: ${ASYNC_SERVICE_URL:-http://host.docker.internal:8000/api/calculate-radius/}
      ASYNC_AUTH_TOKEN: ${ASYNC_AUTH_TOKEN:-secret123}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_started

volumes:
  pg_data:
  minio_data:
